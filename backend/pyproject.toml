[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "auk-reliability"
version = "0.6.6"
requires-python = ">=3.10"
dependencies = ["pyworld==0.3.5", "setuptools<81"]  # prosody transplant (stylefix.py); pyworld 0.3.5 imports pkg_resources, which setuptools>=81 dropped. The Colab notebook installs with --no-deps and adds both itself.
description = "AuK single-worker reliability and evaluation candidate"
[tool.setuptools.packages.find]
include = ["auk_reliability*"]
